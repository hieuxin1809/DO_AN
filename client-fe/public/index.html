<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Suppress cross-origin "Script error." nhưng KHÔNG suppress nếu có filename
       (script local hoặc PayPal/SockJS với CORS chuẩn). Chỉ suppress khi browser
       thật sự giấu detail (không message + không filename). -->
  <script>
    (function () {
      var isCorsHidden = function (msg, src) {
        msg = msg || '';
        src = src || '';
        // Chỉ chặn khi browser hoàn toàn không cho biết gì → đúng nghĩa cross-origin hidden
        // KHÔNG chặn nếu có filename (lỗi PayPal có URL → vẫn cần thấy)
        return (msg === 'Script error.' || msg === 'Script error') && !src;
      };
      var isResizeObs = function (msg) {
        return msg === 'ResizeObserver loop limit exceeded' ||
               msg === 'ResizeObserver loop completed with undelivered notifications.';
      };
      window.addEventListener('error', function (e) {
        var msg = e && e.message;
        var src = e && e.filename;
        if (isResizeObs(msg) || isCorsHidden(msg, src)) {
          e.stopImmediatePropagation();
          e.stopPropagation();
          e.preventDefault();
          if (window.console && console.warn) {
            console.warn('[suppressed]', msg, 'from', src || '(cross-origin)');
          }
          return false;
        }
        // KHÔNG suppress lỗi khác — cho phép thấy chi tiết để debug
      }, true);
      window.onerror = function (msg, src, line, col, err) {
        if (isResizeObs(msg) || isCorsHidden(msg, src)) return true;
        return false;
      };
    })();
  </script>
