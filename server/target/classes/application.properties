# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vaxms}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect
spring.main.lazy-initialization=true
spring.web.resources.add-mappings=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui-custom.html
springdoc.swagger-ui.operationsSorter=method
springdoc.api-docs.path=/api-docs

# Frontend
url.frontend=${FRONTEND_URL:http://localhost:3000}

# PayPal
paypal.client-id=${PAYPAL_CLIENT_ID}
paypal.client-secret=${PAYPAL_CLIENT_SECRET}
paypal.mode=${PAYPAL_MODE:sandbox}
paypal.api-base=${PAYPAL_API_BASE:https://api-m.sandbox.paypal.com}

# Groq AI
groq.api-key=${GROQ_API_KEY}
groq.api-url=${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}
groq.history-max=${GROQ_HISTORY_MAX:10}